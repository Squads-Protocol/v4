[package]
name = "squads-multisig-4r"
version = "0.1.0"
description = "Rust client for the Squads Multisig 4r program"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://squads.so"
repository = "https://github.com/Squads-Protocol/v4"
documentation = "https://docs.rs/squads-multisig-4r"
keywords = ["solana", "multisig", "squads", "client"]

[lib]
name = "squads_multisig_4r"

[features]
default = ["fetch"]
fetch = ["dep:solana-account", "dep:solana-rpc-client", "dep:solana-rpc-client-api"]

[dependencies]
squads-multisig-4r-program = { path = "../../programs/squads_multisig_program", version = "0.1.0", default-features = false }
solana-address = "2.9"
solana-instruction = { version = "3.5", default-features = false }
thiserror = "2.0.21"
solana-account = { version = "4.5", optional = true }
solana-rpc-client = { version = "4.3.2", optional = true }
solana-rpc-client-api = { version = "4.3.2", optional = true }

[dev-dependencies]
# Property tests of the account readers: the official crates encode the accounts.
bincode = "1.3"
proptest = { version = "1.12", default-features = false, features = ["std"] }
serde_json = "1"
solana-loader-v3-interface = { version = "7.0", features = ["serde"] }
solana-program-option = "3.1"
solana-stake-interface = { version = "4.4", features = ["serde"] }
solana-vote-interface = { version = "6.1", features = ["serde"] }
spl-token-2022-interface = "3.1"
spl-token-metadata-interface = "1.0"
