[package]
name = "squads-multisig-4r-cli"
version = "0.1.0"
edition = "2021"
authors = ["Valentin Madrid", "Vova Guguiev"]
license = "MIT OR Apache-2.0"
description = "Command line interface to interact with the Squads Multisig 4r program."

[features]
default = ["ledger"]
ledger = ["dep:solana-remote-wallet", "dep:solana-derivation-path"]

[dependencies]
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "macros"] }
clap = { version = "4.6.7", features = ["derive"] }
eyre = "0.6.14"
dialoguer = "0.12.0"
indicatif = "0.18.6"
colored = "3.1.1"
bincode = "1.3.3"
# Solana deps
solana-sdk = "4.1"
solana-rpc-client = "4.3.2"
solana-rpc-client-api = "4.3.2"
solana-compute-budget-interface = "3.1"
solana-commitment-config = "3.1"
solana-system-interface = { version = "3.3", features = ["bincode"] }
solana-loader-v3-interface = { version = "7.0", features = ["bincode"] }
solana-address-lookup-table-interface = "3.2"
solana-keypair = { version = "3.1", features = ["seed-derivable"] }
solana-signer = "3.0"
bip39 = { version = "2.2.2", features = ["all-languages"] }
solana-remote-wallet = { version = "=4.3.2", features = ["agave-unstable-api"], optional = true }
solana-derivation-path = { version = "3.0", optional = true }
spl-token-interface = "3.0"
spl-associated-token-account-interface = "2.0"
# local deps
squads-multisig-4r = { path = "../sdk/rs", version = "0.1.0" }
