\* Regression: if the custodian always moved after the withdrawer, TLC must report
\* MigrateNeverReverts as violated: without a lockup in force, SetLockup needs the
\* withdrawer, which is already the successor and cannot sign.
CONSTANTS
    MoveCustodian = TRUE
    CustodianFirst = FALSE

INIT Init
NEXT Next

INVARIANTS
    MigrateNeverReverts
