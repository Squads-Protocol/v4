\* Finding F1: after rent reclaim, proposal_create makes a new proposal for the
\* closed index. TLC must report NoOrphanProposal as violated.
CONSTANTS
    Keys = {a, b}
    Vault = Vault
    Admin = Admin
    None = None
    InitMembers = {a, b}
    InitThreshold = 2
    InitAuthority = None
    MaxTx = 1
    MaxBatch = 1
    MaxLock = 1
    Kinds = {"vault"}
    ConfigMenu = {}
    AuthMenu = {}
    VaultMenu <- PayMenu
    SLMembers = {}
    SLAmount = 0
    Protect = TRUE

INIT Init
NEXT Next
SYMMETRY Symmetry

INVARIANTS
    NoOrphanProposal

\* Every index used is a correct end state, not a deadlock.
CHECK_DEADLOCK FALSE
