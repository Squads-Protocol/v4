\* Regression: without check_same_governance, TLC must report NoTheftByMigration as
\* violated: the successor governance drifts to Eve, then a v4 migrate moves assets to her.
CONSTANTS
    Assets = {a1, a2}
    Govs = {"A", "B", "E"}
    EveGovs = {"E"}
    CheckGovernance = FALSE
    SquatPossible = FALSE
    Fees = {0, 1, 2}
    FeeCap = TRUE

INIT Init
NEXT Next

INVARIANTS
    NoTheftByMigration
