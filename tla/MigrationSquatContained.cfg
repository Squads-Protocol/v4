\* Defense in depth: even with a squatted successor, the governance check stops theft.
CONSTANTS
    Assets = {a1, a2}
    Govs = {"A", "B", "E"}
    EveGovs = {"E"}
    CheckGovernance = TRUE
    SquatPossible = TRUE
    Fees = {0, 1, 2}
    FeeCap = TRUE

INIT Init
NEXT Next

INVARIANTS
    TypeOK
    SameGovernanceOnMigrate
    NoTheftByMigration
