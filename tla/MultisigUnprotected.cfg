\* Regression model: execute_message without protected_accounts. A message
\* re-enters the execution of its own transaction. TLC must report
\* ExecuteAtMostOnce as violated.
CONSTANTS
    Keys = {a, b}
    Vault = Vault
    Admin = Admin
    None = None
    InitMembers = {a, b, Vault}
    InitThreshold = 2
    InitAuthority = None
    MaxTx = 1
    MaxBatch = 1
    MaxLock = 1
    Kinds = {"vault"}
    ConfigMenu = {}
    AuthMenu = {}
    VaultMenu <- ReentryMenu
    SLMembers = {}
    SLAmount = 0
    Protect = FALSE

INIT Init
NEXT Next
SYMMETRY Symmetry

INVARIANTS
    ExecuteAtMostOnce

\* Every index used is a correct end state, not a deadlock.
CHECK_DEADLOCK FALSE
