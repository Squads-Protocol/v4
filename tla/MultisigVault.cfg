\* Safety: the vault is a member and the config authority. Vault messages pay,
\* approve other proposals, execute other transactions, and change the config
\* as the authority, inside one execution (CPI).
CONSTANTS
    Keys = {a, b}
    Vault = Vault
    Admin = Admin
    None = None
    InitMembers = {a, b, Vault}
    InitThreshold = 2
    InitAuthority = Vault
    MaxTx = 2
    MaxBatch = 1
    MaxLock = 1
    Kinds = {"vault"}
    ConfigMenu = {}
    AuthMenu = {}
    VaultMenu <- VaultActorMenu
    SLMembers = {}
    SLAmount = 0
    Protect = TRUE

INIT Init
NEXT Next
SYMMETRY Symmetry

INVARIANTS
    TypeOK
    MultisigValid
    UniqueIndex
    FreshMeansUnchanged
    ConfigOnlyAutonomous
    VoteSetsDisjoint
    NoEarlyVotes
    VotesFromVoters
    ActiveUndecided
    FullVoteDecides
    DecisionsHaveQuorum
    DecisionDurable
    ExecuteAtMostOnce
    BatchOrder
    BatchApproved

PROPERTIES
    TransitionsLegal
    VoteGate
    CancelGate
    CloseGate
    ExecuteGate
    ContentFrozen
    PaymentsAuthorized
    AutonomousPermanent

\* Every index used is a correct end state, not a deadlock.
CHECK_DEADLOCK FALSE
