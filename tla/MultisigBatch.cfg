\* Safety: batches of two entries next to config transactions: Draft adds,
\* activation, ordered execution, stale execution, and entry-by-entry close.
CONSTANTS
    Keys = {a, b}
    Vault = Vault
    Admin = Admin
    None = None
    InitMembers = {a, b}
    InitThreshold = 2
    InitAuthority = None
    MaxTx = 2
    MaxBatch = 2
    MaxLock = 1
    Kinds = {"batch", "config"}
    ConfigMenu <- SafeChangeMenu
    AuthMenu = {}
    VaultMenu <- PayMenu
    SLMembers = {}
    SLAmount = 0
    Protect = TRUE

INIT Init
NEXT Next
SYMMETRY Symmetry

INVARIANTS
    TypeOK
    MultisigValid
    UniqueIndex
    FreshMeansUnchanged
    ConfigOnlyAutonomous
    VoteSetsDisjoint
    NoEarlyVotes
    VotesFromVoters
    ActiveUndecided
    FullVoteDecides
    DecisionsHaveQuorum
    DecisionDurable
    ExecuteAtMostOnce
    BatchOrder
    BatchApproved

PROPERTIES
    TransitionsLegal
    VoteGate
    CancelGate
    CloseGate
    ExecuteGate
    ContentFrozen
    PaymentsAuthorized
    AutonomousPermanent

\* Every index used is a correct end state, not a deadlock.
CHECK_DEADLOCK FALSE
