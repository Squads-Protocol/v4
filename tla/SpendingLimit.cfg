\* Safety: a daily-style limit with lazy resets over five periods.
CONSTANTS
    Amount = 2
    Period = 3
    OneTime = FALSE
    MaxNow = 15

INIT Init
NEXT Next

INVARIANTS
    TypeOK
    ResetAligned
    Accounting
    WindowBudget
    SpanBudget

\* The clock bound is a correct end state, not a deadlock.
CHECK_DEADLOCK FALSE
