\* Design (Neodyme ND-SQD2-I1): a spending-limit key needs no membership. A
\* removed member still spends. TLC must report LimitOnlyForMembers as violated.
CONSTANTS
    Keys = {a, b}
    Vault = Vault
    Admin = Admin
    None = None
    InitMembers = {a, b}
    InitThreshold = 1
    InitAuthority = None
    MaxTx = 2
    MaxBatch = 1
    MaxLock = 1
    Kinds = {"config"}
    ConfigMenu <- LimitChangeMenu
    AuthMenu = {}
    VaultMenu <- PayMenu
    SLMembers = {a}
    SLAmount = 1
    Protect = TRUE

INIT Init
NEXT Next

INVARIANTS
    LimitOnlyForMembers

\* Every index used is a correct end state, not a deadlock.
CHECK_DEADLOCK FALSE
