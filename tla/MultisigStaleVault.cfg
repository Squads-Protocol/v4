\* Design (Neodyme ND-SQD1-M2): a vault transaction that was Approved before a
\* config change still executes. TLC must report NoStaleVaultExecution as violated.
CONSTANTS
    Keys = {a, b}
    Vault = Vault
    Admin = Admin
    None = None
    InitMembers = {a, b}
    InitThreshold = 2
    InitAuthority = None
    MaxTx = 2
    MaxBatch = 1
    MaxLock = 1
    Kinds = {"vault", "config"}
    ConfigMenu <- ChangeMenu
    AuthMenu = {}
    VaultMenu <- PayMenu
    SLMembers = {}
    SLAmount = 0
    Protect = TRUE

INIT Init
NEXT Next
SYMMETRY Symmetry

PROPERTIES
    NoStaleVaultExecution

\* Every index used is a correct end state, not a deadlock.
CHECK_DEADLOCK FALSE
