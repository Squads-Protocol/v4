\* Regression: without the max_creation_fee check, TLC must report NoFeeAboveApproval as
\* violated: the fee rises between the approval and the execution of multisig_create_from.
CONSTANTS
    Assets = {a1}
    Govs = {"A", "E"}
    EveGovs = {"E"}
    CheckGovernance = TRUE
    SquatPossible = FALSE
    Fees = {0, 1, 2}
    FeeCap = FALSE

INIT Init
NEXT Next

INVARIANTS
    NoFeeAboveApproval
