\* Safety: a controlled multisig. The config authority (Admin) changes members,
\* permissions, threshold, time lock, and rent collection while votes are
\* pending, and can make the multisig autonomous. Key c starts outside.
CONSTANTS
    Keys = {a, b, c}
    Vault = Vault
    Admin = Admin
    None = None
    InitMembers = {a, b}
    InitThreshold = 1
    InitAuthority = Admin
    MaxTx = 1
    MaxBatch = 1
    MaxLock = 1
    Kinds = {"vault"}
    ConfigMenu = {}
    AuthMenu <- AdminMenu
    VaultMenu <- PayMenu
    SLMembers = {}
    SLAmount = 0
    Protect = TRUE

INIT Init
NEXT Next

INVARIANTS
    TypeOK
    MultisigValid
    UniqueIndex
    FreshMeansUnchanged
    ConfigOnlyAutonomous
    VoteSetsDisjoint
    NoEarlyVotes
    VotesFromVoters
    ActiveUndecided
    FullVoteDecides
    DecisionsHaveQuorum
    DecisionDurable
    ExecuteAtMostOnce
    BatchOrder
    BatchApproved

PROPERTIES
    TransitionsLegal
    VoteGate
    CancelGate
    CloseGate
    ExecuteGate
    ContentFrozen
    PaymentsAuthorized
    AutonomousPermanent

\* Every index used is a correct end state, not a deadlock.
CHECK_DEADLOCK FALSE
