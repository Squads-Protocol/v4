\* Regression: if someone could sign as the successor create_key (for example, the v4
\* create_key), TLC must report SuccessorFromLineage as violated.
CONSTANTS
    Assets = {a1, a2}
    Govs = {"A", "B", "E"}
    EveGovs = {"E"}
    CheckGovernance = TRUE
    SquatPossible = TRUE
    Fees = {0, 1, 2}
    FeeCap = TRUE

INIT Init
NEXT Next

INVARIANTS
    SuccessorFromLineage
