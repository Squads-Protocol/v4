[package]
name = "squads-multisig-4r-program"
version = "0.1.0"
description = "Squads Multisig Program 4r (version 4, revised)"
edition = "2021"
license-file = "../../LICENSE"

[lib]
crate-type = ["cdylib", "lib"]
name = "squads_multisig_4r_program"

[features]
default = ["custom-heap"]
custom-heap = []
custom-panic = []
anchor-debug = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
testing = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.1", default-features = false, features = ["solana-v4", "allow-missing-optionals"] }
anchor-spl = { version = "1.2.1", default-features = false, features = ["solana-v4", "token", "token_2022"] }
solana-program = "4.1"
solana-security-txt = "1.1.3"
solana-address-lookup-table-interface = { version = "3.2", features = ["bincode", "bytemuck"] }
solana-borsh = "3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
