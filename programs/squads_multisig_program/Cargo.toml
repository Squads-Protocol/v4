[package]
name = "squads-multisig-4r-program"
version = "0.1.0"
description = "Squads Multisig Program 4r (version 4, revised)"
edition = "2021"
license-file = "../../LICENSE"

[lib]
crate-type = ["cdylib", "lib"]
name = "squads_multisig_4r_program"

[features]
# `no-log-ix-name`: no "Instruction: <name>" log line. Events replace log-based indexing.
default = ["program", "custom-heap", "no-log-ix-name", "custom-entrypoint"]
# The Anchor program: handlers, entrypoint, CPI module and IDL. Without it, only the core
# types, builders and helpers are compiled (no Anchor, no solana-program).
program = [
    "dep:anchor-lang",
    "dep:anchor-spl",
    "dep:solana-program",
    "dep:solana-security-txt",
    "dep:solana-address-lookup-table-interface",
    "dep:solana-borsh",
]
custom-heap = ["program"]
custom-panic = ["program"]
anchor-debug = ["program"]
no-entrypoint = ["program"]
# Our entrypoint (src/entrypoint.rs): `log_event` returns before Anchor's dispatch. It replaces
# Anchor's entrypoint, so it turns on `no-entrypoint`. Libraries use `cpi` or the core
# (`default-features = false`), never `no-entrypoint` with the default features.
custom-entrypoint = ["program", "no-entrypoint"]
no-idl = ["program"]
no-log-ix-name = ["program"]
cpi = ["program", "no-entrypoint"]
testing = []
idl-build = ["program", "anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
borsh = { version = "1.5.7", features = ["derive"] }
solana-address = { version = "2.9", features = ["borsh", "copy", "curve25519", "decode"] }
solana-instruction = { version = "3.5", default-features = false }
thiserror = "2.0.21"
anchor-lang = { version = "1.2.1", default-features = false, features = ["solana-v4", "allow-missing-optionals"], optional = true }
anchor-spl = { version = "1.2.1", default-features = false, features = ["solana-v4", "token", "token_2022"], optional = true }
solana-program = { version = "4.1", optional = true }
solana-security-txt = { version = "1.1.3", optional = true }
solana-address-lookup-table-interface = { version = "3.2", features = ["bincode", "bytemuck"], optional = true }
solana-borsh = { version = "3.0", optional = true }

[dev-dependencies]
serde_json = "1"
solana-address = { version = "2.9", features = ["atomic"] }
# Property tests of the account readers: the official crates encode the accounts.
bincode = "1.3"
proptest = { version = "1.12", default-features = false, features = ["std"] }
solana-loader-v3-interface = { version = "7.0", features = ["serde"] }
solana-program-option = "3.1"
solana-stake-interface = { version = "4.4", features = ["serde"] }
solana-vote-interface = { version = "6.1", features = ["serde"] }
spl-token-2022-interface = "3.1"
spl-token-metadata-interface = "1.0"

[[test]]
name = "golden_wire_format"
required-features = ["program"]

[[test]]
name = "core_matches_anchor"
required-features = ["program"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(kani)'] }

# `cargo kani` reads this; other builds ignore it. The proofs replace the PDA derivation (stubbing).
[package.metadata.kani]
unstable = { stubbing = true }
