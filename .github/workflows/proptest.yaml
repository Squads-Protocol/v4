name: Property tests

# `cargo test --workspace` (tests.yaml) runs each property with the proptest default of 256 cases.
# This workflow runs the same properties with many more cases: 100k on pull requests and pushes,
# 1M every night. The seed is the run ID, so `PROPTEST_RNG_SEED=<seed> PROPTEST_CASES=<cases>
# cargo test ...` repeats a run on a local machine.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      cases:
        description: "Cases for each property"
        required: false
        default: "1000000"
      seed:
        description: "RNG seed (u64). Empty: the run ID"
        required: false
        default: ""

permissions:
  contents: read

env:
  PROPTEST_CASES: ${{ inputs.cases || (github.event_name == 'schedule' && '1000000' || '100000') }}
  PROPTEST_RNG_SEED: ${{ inputs.seed || github.run_id }}

jobs:
  account-readers:
    name: Account readers (program, Rust SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust/

      - name: Cache Cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./target/
          key: proptest-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Build
        run: |
          cargo test -p squads-multisig-4r-program --lib --no-run
          cargo test -p squads-multisig-4r --test account_readers --no-run

      - name: Run
        shell: bash
        run: |
          echo "Cases: $PROPTEST_CASES, seed: $PROPTEST_RNG_SEED" >> "$GITHUB_STEP_SUMMARY"
          cargo test -p squads-multisig-4r-program --lib proptests
          cargo test -p squads-multisig-4r --test account_readers

      # proptest writes the shrunk failure seed to these files. Commit the new `cc` lines so that
      # every later `cargo test` runs the failure case first.
      - name: Upload regression seeds
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: proptest-regressions
          path: |
            programs/squads_multisig_program/proptest-regressions/
            sdk/rs/tests/*.proptest-regressions
          if-no-files-found: ignore
