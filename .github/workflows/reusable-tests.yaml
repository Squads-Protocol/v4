name: Reusable Tests

on:
  workflow_call:
    inputs:
      cache:
        required: true
        type: boolean
      solana_cli_version:
        required: true
        type: string
      node_version:
        required: true
        type: string
      cargo_profile:
        required: true
        type: string
      anchor_version:
        required: true
        type: string

env:
  CACHE: ${{ inputs.cache }}
  SOLANA_CLI_VERSION: ${{ inputs.solana_cli_version }}
  NODE_VERSION: ${{ inputs.node_version }}
  CARGO_PROFILE: ${{ inputs.cargo_profile }}
  ANCHOR_VERSION: ${{ inputs.anchor_version }}

jobs:
  rust:
    name: Rust (fmt, check, unit + golden wire-format tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust/

      - name: Cache Cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./target/
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
        shell: bash

      - name: Format
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  ts-sdk:
    name: "@sqds/multisig-4r (typecheck, unit tests)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/multisig-4r
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sdk/multisig-4r/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  integration:
    name: Integration (solana-test-validator, SBPF v3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Solana
        uses: ./.github/actions/setup-solana/

      - name: Setup Rust
        uses: ./.github/actions/setup-rust/

      - name: Setup Anchor
        uses: ./.github/actions/setup-anchor/

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Cache Cargo `target` directory
        uses: actions/cache@v6
        with:
          path: ./target/
          key: target-dir-${{ runner.os }}-${{ env.CARGO_PROFILE }}-${{ hashFiles('./Cargo.lock') }}

      - name: Build and run integration tests
        run: bun run test

      - name: "@sqds/multisig-4r integration test"
        run: |
          solana-test-validator --reset --quiet --ledger /tmp/sdk-ledger \
            --bpf-program GyhGAqjokLwF9UXdQ2dR5Zwiup242j4mX4J1tSMKyAmD target/deploy/squads_multisig_4r_program.so &
          for _ in $(seq 1 60); do solana -ul cluster-version >/dev/null 2>&1 && break; sleep 1; done
          cd sdk/multisig-4r && npm ci --ignore-scripts && npm run test:integration
