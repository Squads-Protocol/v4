name: Reusable Tests

on:
  workflow_call:
    inputs:
      cache:
        required: true
        type: boolean
      solana_cli_version:
        required: true
        type: string
      node_version:
        required: true
        type: string
      cargo_profile:
        required: true
        type: string
      anchor_version:
        required: true
        type: string

env:
  CACHE: ${{ inputs.cache }}
  SOLANA_CLI_VERSION: ${{ inputs.solana_cli_version }}
  NODE_VERSION: ${{ inputs.node_version }}
  CARGO_PROFILE: ${{ inputs.cargo_profile }}
  ANCHOR_VERSION: ${{ inputs.anchor_version }}

jobs:
  rust:
    name: Rust (fmt, check, tests, core without Anchor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust/

      - name: Cache Cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./target/
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
        shell: bash

      - name: Format
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Core without Anchor (clippy, tests)
        run: |
          cargo clippy -p squads-multisig-4r-program --no-default-features --all-targets -- -D warnings
          cargo test -p squads-multisig-4r-program --no-default-features

      - name: Program entrypoint variants (cpi client, Anchor entrypoint)
        run: |
          cargo clippy -p squads-multisig-4r-program --features cpi --all-targets -- -D warnings
          cargo clippy -p squads-multisig-4r-program --no-default-features --features program,custom-heap,no-log-ix-name --all-targets -- -D warnings

      - name: Core dependency tree has no Anchor or solana-program
        shell: bash
        run: |
          for crate in squads-multisig-4r-program squads-multisig-4r; do
            tree=$(cargo tree -p "$crate" --no-default-features -e normal --prefix none)
            if grep -E '^(anchor-|solana-program )' <<<"$tree"; then
              echo "::error::$crate pulls Anchor or solana-program without default features"
              exit 1
            fi
          done

  kani:
    name: Kani proofs (migration rules)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KANI_VERSION: "0.68.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust/

      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup
        shell: bash

      # Settings (stubbing, loop bounds) are in `[workspace.metadata.kani]` of the root Cargo.toml.
      - name: Prove the migration rules
        run: cargo kani -p squads-multisig-4r-program --no-default-features

  ts-sdk:
    name: "@sqds/multisig-4r (typecheck, unit tests)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/multisig-4r
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sdk/multisig-4r/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  integration:
    name: Integration (solana-test-validator, SBPF v3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Solana
        uses: ./.github/actions/setup-solana/

      - name: Setup Rust
        uses: ./.github/actions/setup-rust/

      - name: Setup Anchor
        uses: ./.github/actions/setup-anchor/

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Cache Cargo `target` directory
        uses: actions/cache@v6
        with:
          path: ./target/
          key: target-dir-${{ runner.os }}-${{ env.CARGO_PROFILE }}-${{ hashFiles('./Cargo.lock') }}

      - name: Build and run integration tests
        run: bun run test

      - name: "@sqds/multisig-4r integration test"
        # `anchor test` sends SIGKILL to its validator and does not wait for it to exit, so the
        # default RPC (8899) and faucet (9900) ports can still be bound when this step starts.
        # These ports are outside the default dynamic port range (8000-10000) of both validators.
        env:
          RPC_PORT: 18899
          FAUCET_PORT: 19900
          RPC_URL: http://127.0.0.1:18899
          RPC_WS_URL: ws://127.0.0.1:18900
        # The migration tests need the mainnet v4, v3 (Squads MPL), v3 roles and Token-2022 programs,
        # the v4 ProgramConfig, and upgradeable programs owned by a fixed v4 vault and a fixed v3
        # authority (tests/fixtures/v4-mainnet/README.md, tests/fixtures/v3-mainnet/README.md).
        run: |
          (cd tests/fixtures/v4-mainnet && sha256sum -c SHA256SUMS)
          (cd tests/fixtures/v3-mainnet && sha256sum -c SHA256SUMS)
          solana-test-validator --reset --quiet --ledger /tmp/sdk-ledger \
            --rpc-port "$RPC_PORT" --faucet-port "$FAUCET_PORT" \
            --bpf-program GyhGAqjokLwF9UXdQ2dR5Zwiup242j4mX4J1tSMKyAmD target/deploy/squads_multisig_4r_program.so \
            --bpf-program SQDS4ep65T869zMMBKyuUq6aD6EgTu8psMjkvj52pCf tests/fixtures/v4-mainnet/squads_v4.so \
            --bpf-program TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb tests/fixtures/v4-mainnet/spl_token_2022.so \
            --bpf-program SMPLecH534NA9acpos4G6x7uf3LWbCAwZQE9e8ZekMu tests/fixtures/v3-mainnet/squads_mpl.so \
            --bpf-program SMPLvKJwsyNGD6xf7Ph6VRpDGPa3DXV4uPHcTAnXe6r tests/fixtures/v3-mainnet/roles.so \
            --account BSTq9w3kZwNwpBXJEvTZz2G9ZTNyKBvoSeXMvwb4cNZr tests/fixtures/v4-mainnet/program_config.json \
            --upgradeable-program 5Yk7if5XWfc34w2n8Zr2h6giukrKUFMBy98ACXvJZBL1 tests/fixtures/v4-mainnet/squads_v4.so \
              4GXYAfWWYJKtYwNtzdNMEMVYsqJBzZ363RZXT7Wjec9Q \
            --upgradeable-program 5bV6jUfhDHCQVA1WfKBUnXUsboJgoKgkzkKcxr3joew5 tests/fixtures/v4-mainnet/squads_v4.so \
              2JbpQGYRrGfgHjU8akLGq2RdK8U2hruXBVhWLLRa6exf &
          validator=$!
          for _ in $(seq 1 60); do
            solana -u "$RPC_URL" cluster-version >/dev/null 2>&1 && break
            if ! kill -0 "$validator" 2>/dev/null; then
              echo "::error::solana-test-validator exited during startup"
              sudo ss -ltnp
              exit 1
            fi
            sleep 1
          done
          if ! solana -u "$RPC_URL" cluster-version >/dev/null 2>&1; then
            echo "::error::solana-test-validator did not answer RPC after 60 s"
            exit 1
          fi

          cd sdk/multisig-4r && npm ci --ignore-scripts && npm run test:integration
