name: "Setup Anchor"
description: "Install the Anchor CLI from crates.io"
runs:
  using: "composite"
  steps:
    - name: Restore cached Anchor CLI
      id: restore-cache-anchor
      uses: actions/cache/restore@v6
      with:
        path: ~/.cargo/bin/anchor
        key: ${{ runner.os }}-anchor-cli-${{ env.ANCHOR_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}

    - if: steps.restore-cache-anchor.outputs.cache-hit != 'true'
      name: Install system dependencies for Anchor CLI
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y pkg-config build-essential libssl-dev libudev-dev

    - if: steps.restore-cache-anchor.outputs.cache-hit != 'true'
      name: Install Anchor CLI
      shell: bash
      run: cargo install anchor-cli --version ${{ env.ANCHOR_VERSION }} --locked

    - if: steps.restore-cache-anchor.outputs.cache-hit != 'true'
      name: Save Anchor CLI to cache
      uses: actions/cache/save@v6
      with:
        path: ~/.cargo/bin/anchor
        key: ${{ steps.restore-cache-anchor.outputs.cache-primary-key }}
